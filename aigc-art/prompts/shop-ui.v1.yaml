  - "  │                                              │"
  - "  │  ┌relic_display_slot─────────────────────┐   │"
  - "  │  │  [relic icon]  圣器名  desc...  price  │   │"
  - "  │  └───────────────────────────────────────┘   │"
  - "  │                                              │"
  - "  │  [restock_lever]               ┌note_paper─┐│"
  - "  │   换架 (Space)                  │ ✏️ 批注    ││"
  - "  │                                └──────────┘│"
  - "  │  ← → 选择  Enter 征用  Esc 离开             │"
  - "  └──────────────────────────────────────────────┘"
  - ""
  - "=== 交互反馈 ==="
  - "征用(购买)确认：requisition_stamp 从上方落下盖在 item_card 上"
  - "已售出：item_card_sold 替换 item_card（红章覆盖）"

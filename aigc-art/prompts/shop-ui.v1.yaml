  - ""
  - "=== 叙事元素 ==="
  - "note_paper 右下角固定位置，每次进商店随机显示一条 ✏️ shopnote"
  - "偶尔���件物品的 desc 里出现'已被 D-XXXX 退回'（叙事细节）"
  - "圣器(relic)用 relic_display_slot 单独展示，铭文组(skill)用普通 item_card"

polish_checklist:
  - "shop_bg 油灯暖光区域对应商品展示区，暗角对应边缘"
  - "item_card 可横向/纵向 9-slice 拉伸，适应不同描述长度"
  - "price_tag 小巧不抢焦点，金色调与金币图标统一"
  - "note_paper 手写感强，与其他正式元素形成反差（✏️ 声部的视觉锚）"
  - "requisition_stamp 红章在 parchment 上视觉冲击力强"
  - "relic_display_slot 比普通 item_card 更庄重，暗示稀有度"
  - "所有颜色严格来自 resurrect-32"
  - "整体氛围：昏暗、温暖、��度感 + 人情味的角落"

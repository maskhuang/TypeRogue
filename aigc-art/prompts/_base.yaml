# aigc-art/prompts/_base.yaml
# 所有 asset prompt 共享的基线。各 asset 文件通过 extends: _base.yaml 继承。
# 修改此文件会影响所有资产生成，**必须 bump 全局 prompt 版本**并在 commit 说明。

version: "base.v2"
last_updated: "2026-04-15"

# ============================================================
# 模型与推理配置
# ============================================================
# 切换说明（base.v1 → v2, 2026-04-15）：
#   v1 用 black-forest-labs/flux-dev（原版，不支持 LoRA 输入字段，
#   hf_lora 被静默忽略）→ 从未真正跑出像素风。
#   v2 切到 lucataco/flux-dev-lora 封装，传入 HF LoRA 路径
#   prithivMLmods/Retro-Pixel-Flux-LoRA（触发词 "Retro Pixel"）。
model:
  provider: replicate
  # 锁版本防漂移（2026-04-15 取的 latest_version.id）
  id: "lucataco/flux-dev-lora:091495765fa5ef2725a175a57b276ec30dc9d39c22d30410f2ede68a3eab66b3"
  lora:
    - name: "retro-pixel-flux"
      weight: 0.95
      source: "prithivMLmods/Retro-Pixel-Flux-LoRA"
      trigger_word: "Retro Pixel"

sampler: "dpm++ 2m karras"
steps: 28
cfg: 3.5                # Flux-dev 推荐 3-4；原 6.5 偏高
batch_size: 6           # Flux-dev-lora 单次生成更慢，batch 适度压缩
retry_until_pass: 3     # 最多重跑 3 次直到 ≥1 张过闸门
auto_seed: true         # 每个 variation 随机 seed，失败重跑换 seed

# ============================================================
# 共享 Prompt 片段
# ============================================================
# ============================================================
# 共享 Prompt 片段（按资产类型分）
# 参见 STYLE_GUIDE.md 获取完整设计理由
# ============================================================

# 默认 shared（向后兼容，= sprite 类型）
shared_positive: |
  Retro Pixel,
  pixel art, 16-bit retro game sprite,
  clean silhouette, 1px black outline,
  limited palette 32 colors from resurrect-32,
  centered composition, transparent background,
  crisp pixels, no anti-aliasing, no gradient shading,
  side view, flat shading with 1 highlight tone

shared_negative: |
  anti-aliased, blurry, soft edges, gradient shading, bloom, glow,
  3d render, realistic, photographic, photo, modern ui,
  high resolution texture, jpeg artifacts, compression artifacts,
  cute mascot face, anime face, kawaii, chibi, big eyes,
  watermark, signature, text, logo, border, frame

# --- 场景/背景专用 ---
shared_positive_scene: |
  Retro Pixel, pixel art, 16-bit,
  FULLY ENCLOSED INTERIOR underground cathedral,
  NO sky NO outdoor NO windows showing outside,
  gothic industrial architecture fusion:
  pointed iron arches, brass pipe organs, riveted iron columns,
  vaulted ceiling with copper pipes along ribs,
  limited palette 32 colors from resurrect-32,
  crisp pixels, no anti-aliasing, flat shading,
  wide aspect ratio 16:9, frontal symmetric composition,
  strong color accent against dark background

shared_negative_scene: |
  sky, clouds, sun, moon, stars, sunset, sunrise, outdoor,
  trees, forest, mountain, hills, plains, grass, nature, landscape,
  window showing outside, open air, horizon line,
  bright saturated colors, rainbow, neon,
  anti-aliased, blurry, gradient, bloom, glow,
  3d render, realistic, photographic, photo,
  character, person, enemy, creature,
  cute, kawaii, chibi, anime,
  text, logo, watermark

# --- 纹理/UI面板专用 ---
shared_positive_texture: |
  Retro Pixel, pixel art,
  seamless tileable texture, game ui panel material,
  top-down flat view, surface pattern,
  limited palette 32 colors from resurrect-32,
  crisp pixels, no anti-aliasing, flat shading

shared_negative_texture: |
  character, person, creature, animal, monster, face, eyes, body,
  sprite, silhouette, side view, portrait,
  anti-aliased, blurry, gradient, bloom, glow,
  3d render, realistic, photographic, photo,
  cute, anime, kawaii, chibi,
  sky, outdoor, landscape,
  text, writing, letters, numbers, logo

# --- 道具/物件专用 ---
shared_positive_prop: |
  Retro Pixel, pixel art, single game prop object,
  gothic industrial aesthetic,
  lead and brass materials, aged and well-used,
  oil stains, wax drips, wear marks,
  centered on transparent background,
  limited palette 32 colors from resurrect-32,
  crisp pixels, no anti-aliasing, flat shading

shared_negative_prop: |
  character, person, enemy, creature, landscape,
  modern, sci-fi, neon, plastic, glass,
  bright cheerful colors, cute, kawaii,
  anti-aliased, blurry, gradient, bloom, glow,
  3d render, realistic, photographic,
  text, logo, watermark

# ============================================================
# 后处理默认配置
# ============================================================
postprocess:
  palette_file: "references/palette/resurrect-32.png"
  bg_removal: "corner-floodfill"   # 从 4 角 flood-fill 判透明
  alpha_threshold: 0.05            # < 5% 不透明像素视为背景
  outline_enforce: false           # 默认 off，需要的资产单独 on
  downscale_method: "nearest"      # **禁止** bilinear / lanczos

# ============================================================
# 评测闸门默认阈值（可被 asset 级覆盖）
# ============================================================
eval:
  palette_strict: true             # 必须 ⊂ resurrect-32
  alpha_halo_max: 0                # 0 = 零容忍半透明残留
  silhouette_sharpness_min: 0.30   # Sobel edge 响应下限
  clip_similarity_min: 0.80        # Q4 紧阈值
  dimensions_exact: true           # shape 必须严格等于 target_size

# ============================================================
# Metadata 记录（每次 run 自动写入 runs/**/metadata.json）
# ============================================================
metadata:
  record:
    - prompt_version
    - prompt_hash
    - model
    - lora
    - seeds
    - cost_usd
    - wall_time_sec
    - eval_pass_count
    - human_pick

# aigc-art/prompts/_base.yaml
# 所有 asset prompt 共享的基线。各 asset 文件通过 extends: _base.yaml 继承。
# 修改此文件会影响所有资产生成，**必须 bump 全局 prompt 版本**并在 commit 说明。

version: "base.v2"
last_updated: "2026-04-15"

# ============================================================
# 模型与推理配置
# ============================================================
# 切换说明（base.v1 → v2, 2026-04-15）：
#   v1 用 black-forest-labs/flux-dev（原版，不支持 LoRA 输入字段，
#   hf_lora 被静默忽略）→ 从未真正跑出像素风。
#   v2 切到 lucataco/flux-dev-lora 封装，传入 HF LoRA 路径
#   prithivMLmods/Retro-Pixel-Flux-LoRA（触发词 "Retro Pixel"）。
model:
  provider: replicate
  # 锁版本防漂移（2026-04-15 取的 latest_version.id）
  id: "lucataco/flux-dev-lora:091495765fa5ef2725a175a57b276ec30dc9d39c22d30410f2ede68a3eab66b3"
  lora:
    - name: "retro-pixel-flux"
      weight: 0.95
      source: "prithivMLmods/Retro-Pixel-Flux-LoRA"
      trigger_word: "Retro Pixel"

sampler: "dpm++ 2m karras"
steps: 28
cfg: 3.5                # Flux-dev 推荐 3-4；原 6.5 偏高
batch_size: 6           # Flux-dev-lora 单次生成更慢，batch 适度压缩
retry_until_pass: 3     # 最多重跑 3 次直到 ≥1 张过闸门
auto_seed: true         # 每个 variation 随机 seed，失败重跑换 seed

# ============================================================
# 共享 Prompt 片段
# ============================================================
# 触发词前置保证 LoRA 生效；其余风格锚定跟 v1 保持一致。
shared_positive: |
  Retro Pixel,
  pixel art, 16-bit retro game sprite,
  clean silhouette, 1px black outline,
  limited palette 32 colors from resurrect-64 subset,
  centered composition, transparent background,
  crisp pixels, no anti-aliasing, no gradient shading,
  side view, flat shading with 1 highlight tone

shared_negative: |
  anti-aliased, blurry, soft edges, gradient shading, bloom, glow,
  3d render, realistic, photographic, photo, modern ui,
  high resolution texture, jpeg artifacts, compression artifacts,
  cute mascot face, anime face, kawaii, chibi, big eyes,
  watermark, signature, text, logo, border, frame

# ============================================================
# 后处理默认配置
# ============================================================
postprocess:
  palette_file: "references/palette/resurrect-32.png"
  bg_removal: "corner-floodfill"   # 从 4 角 flood-fill 判透明
  alpha_threshold: 0.05            # < 5% 不透明像素视为背景
  outline_enforce: false           # 默认 off，需要的资产单独 on
  downscale_method: "nearest"      # **禁止** bilinear / lanczos

# ============================================================
# 评测闸门默认阈值（可被 asset 级覆盖）
# ============================================================
eval:
  palette_strict: true             # 必须 ⊂ resurrect-32
  alpha_halo_max: 0                # 0 = 零容忍半透明残留
  silhouette_sharpness_min: 0.30   # Sobel edge 响应下限
  clip_similarity_min: 0.80        # Q4 紧阈值
  dimensions_exact: true           # shape 必须严格等于 target_size

# ============================================================
# Metadata 记录（每次 run 自动写入 runs/**/metadata.json）
# ============================================================
metadata:
  record:
    - prompt_version
    - prompt_hash
    - model
    - lora
    - seeds
    - cost_usd
    - wall_time_sec
    - eval_pass_count
    - human_pick

# aigc-art/prompts/hud-texture.v1.yaml
# HUD 纹理灵感生成（Story 57.3 Task 4）
#
# ⚠️ 本 prompt 是 Q5 决策下的"半自动"流程：
#    AI 只生成纹理板（木纹/铁钉/铆钉质感灵感），
#    9-slice 几何结构 100% 人工在 Aseprite 中拼。
#
# 因此本 prompt 的 pipeline **不跑 human pick / polish / export 全流程**，
# 只跑到 runs/**/raw/ 阶段就停。

version: "hud-texture.v1"
extends: _base.yaml
last_updated: "2026-04-14"

asset_id: hud-texture
target_size: [256, 256]       # 纹理板不做 downscale，保留大图供裁切
gen_size: [256, 256]
pipeline_mode: "draft-only"   # 特殊模式：仅跑到 ① Draft Gen，跳过 ②-⑥

# ============================================================
# 纹理专用 shared prompt（覆盖 _base.yaml 的角色 sprite 指令）
# ============================================================
positive_override: |
  Retro Pixel,
  pixel art seamless texture, game ui panel material,
  top-down flat view, tileable surface pattern,
  limited palette 32 colors, crisp pixels,
  no anti-aliasing, no gradient shading, flat shading,
  {pose_hint}

negative_override: |
  character, person, creature, animal, monster, face, eyes, body,
  sprite, silhouette, side view, portrait,
  anti-aliased, blurry, soft edges, gradient shading, bloom, glow,
  3d render, realistic, photographic, photo,
  cute, anime, kawaii, chibi,
  text, writing, letters, numbers, logo

# ============================================================
# HUD 组件纹理 × 层级主题矩阵
# 4 种组件 × 3 种层级主题 = 12 变体
# 层级主题随玩家爬塔递进，HUD 材质跟着变化
# ============================================================
#
# 层级主题设计依据（docs/narrative-design.md）：
#   foundry (L1-6):  木/铁/羊皮纸 — 手工质感，温暖但陈旧
#   mechanical (L7-10): 黄铜/铜管/蒸汽 — 精密机械，冷暖交替
#   core (L11-12): 黑曜石/铅/微光 — 沉压神圣，极简深邃
#
variations:
  # === 铸字坊/抄写室主题 (Layer 1-6) ===
  - suffix: hp_bar_foundry
    pose_hint: |
      ancient wooden plank with iron rivets,
      dark oak grain, brass nail heads, worn edges
  - suffix: score_panel_foundry
    pose_hint: |
      parchment texture with leather binding edges,
      aged paper, coffee stains, ink splatter marks
  - suffix: timer_foundry
    pose_hint: |
      brass gear frame border texture,
      clockwork engraving, warm metal tones, oil stains
  - suffix: skill_slot_foundry
    pose_hint: |
      dark iron inlay square frame with lead border,
      hammered metal texture, rivet corners, warm shadow inside

  # === 机械层主题 (Layer 7-10) ===
  - suffix: hp_bar_mechanical
    pose_hint: |
      polished copper pipe cross-section,
      steam-cleaned metal, precise riveted seams, industrial gauge panel
  - suffix: score_panel_mechanical
    pose_hint: |
      brushed brass plate texture with engraved border,
      precision machined surface, fine gear-tooth edge pattern
  - suffix: timer_mechanical
    pose_hint: |
      flat surface texture of interlocking steel gears seen from above,
      top-down view of gear teeth pattern, chrome and brass metal layers,
      circular valve wheel shape embossed into metal surface
  - suffix: skill_slot_mechanical
    pose_hint: |
      flat square metal panel texture with copper rim border,
      recessed dark center area, riveted copper edge trim,
      brushed steel surface with subtle blue-grey tint,
      simple geometric frame, no depth, flat top-down view

  # === 引擎核心主题 (Layer 11-12) ===
  - suffix: hp_bar_core
    pose_hint: |
      black obsidian slab with lead inlay veins,
      deep shadow, faint warm glow from within cracks, ancient and sacred
  - suffix: score_panel_core
    pose_hint: |
      dark stone tablet texture with lead type impressions,
      embossed marks, single warm light source from edge, solemn and monumental
  - suffix: timer_core
    pose_hint: |
      massive flywheel cross-section texture,
      concentric dark iron rings, single faint golden light at center,
      oppressive weight and scale
  - suffix: skill_slot_core
    pose_hint: |
      deep void frame with obsidian border and lead trim,
      faint warm glow seeping from edges, bottomless dark interior,
      reverent and ominous

# ============================================================
# 后处理：极简
# ============================================================
postprocess:
  palette_file: "references/palette/resurrect-32.png"
  outline_enforce: false        # 纹理板不加描边
  bg_removal: "none"            # 保留背景（纹理本来就要全覆盖）
  center_crop: false

# ============================================================
# 评测：仅跑调色板检查（其他闸门对纹理板无意义）
# ============================================================
eval:
  palette_strict: true
  alpha_halo_max: 999           # 纹理板可以全不透明或半透
  silhouette_sharpness_min: 0   # 纹理无剪影概念
  clip_similarity_min: 0        # 纹理风格可多样，不做 CLIP 限制

# ============================================================
# 手工 polish 指引（Aseprite 内完成，极其重要）
# ============================================================
manual_9slice_steps:
  - "打开 runs/**/raw/ 中选中的纹理板"
  - "在 Aseprite 中创建新文件：32×16（hp_bar）/ 64×32（score_panel）等目标尺寸"
  - "用 Color Picker 从纹理板取色，手绘 9-slice 的 9 个小块"
  - "角 4 块单独画（含边线交界）"
  - "边 4 块画 repeating pattern 片段（左右/上下各 1 个）"
  - "中 1 块画 tileable 中心填充"
  - "保存 art-source/57-3/hud/{component}.aseprite"
  - "同名 .json 写 9-slice 边距：{top, right, bottom, left}"
  - "Godot sandbox 内拉伸到 2x/4x/8x 尺寸验证无畸形"

output:
  runs_dir: "runs/{date}_{asset_id}/"
  # 注意：这里**不**写 aseprite_target_dir / godot_target_dir —— pipeline 不自动导出
  manual_target_dir: "../art-source/57-3/hud/"

# aigc-art/prompts/enemy-dummy.v1.yaml
# 训练假人敌人（Story 57.3 Task 5）
#
# 本 prompt 是 pipeline 验证的首个资产：先跑通 dummy，再批量生产键帽/特效/背景。

version: "enemy-dummy.v1"
extends: _base.yaml
last_updated: "2026-04-14"

asset_id: enemy-dummy
target_size: [32, 48]         # 宽 32 × 高 48，Story 57.3 基准敌人规格
gen_size: [256, 384]          # 8× 目标，给 nearest downscale 留足空间

# ============================================================
# Positive / Negative 覆盖
# ============================================================
positive_override: |
  a straw training dummy, wooden post with straw head,
  burlap wrapping body, rope ties, slight lean,
  grounded on small dirt patch, side view,
  fantasy rpg enemy sprite, idle pose,
  {shared_positive}

negative_override: |
  {shared_negative},
  human face, eyes, mouth, teeth,
  weapon, sword, armor, metal plate,
  player character, hero, humanoid pose,
  animal, creature, monster teeth,
  background scenery

# ============================================================
# 状态变体（3 种动画状态，每种生成 batch_size 张）
# ============================================================
variations:
  - suffix: idle
    frames: 4
    pose_hint: "neutral standing, very slight breathing sway"
  - suffix: hit
    frames: 2
    pose_hint: "impact flash, body recoiling back, dust puff"
  - suffix: death
    frames: 6
    pose_hint: "collapsing backward, straw scattering, final frame fallen flat"

# ============================================================
# 后处理覆盖
# ============================================================
postprocess:
  outline_enforce: true         # 敌人强制 1px 黑描边
  center_crop: true             # 居中裁剪到 target_size

# ============================================================
# 评测覆盖
# ============================================================
eval:
  # 金标：本地 references/golden/ 下符合 enemy_*.png glob 的图
  style_golden_glob: "references/golden/enemy_*.png"
  # 若金标数量 < 2，fallback 用 mood-board 下的 enemy 截图
  fallback_golden_glob: "references/mood-board/enemy_*.png"
  clip_similarity_min: 0.80     # 继承 base；显式写出以便本 asset 独立调

# ============================================================
# 输出路径
# ============================================================
output:
  runs_dir: "runs/{date}_{asset_id}/"
  aseprite_target_dir: "../art-source/57-3/enemies/dummy/"
  godot_target_dir: "../godot/assets/sprites/enemies/dummy/"

# ============================================================
# 手工 polish 检查表（pick 后提示人工确认）
# ============================================================
polish_checklist:
  - "帧间主体位置一致（2px 容差）"
  - "idle 4 帧循环无跳帧"
  - "hit flash 颜色为高亮白或浅黄，非红"
  - "death 最后一帧完全倒地（主体在下半部）"
  - "所有颜色来自 resurrect-32（Aseprite Palette > Presets 校验）"
  - "1px 黑描边完整包围主体"

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>打字肉鸽</title>
</head>
<body>
    <div id="game-container">
        <!-- === BATTLE SCREEN === -->
        <div id="battle-screen" class="screen">
            <!-- 顶部信息栏 -->
            <div id="top-bar">
                <div id="level-info">
                    <span id="level-label">LEVEL 1</span>
                    <div id="hud-stage-info" class="hud-stage-info"></div>
                    <div id="player-relics"></div>
                </div>
                <div id="modifier-info">
                    <span class="modifier-icon"></span>
                    <span class="modifier-name"></span>
                    <span class="modifier-hint"></span>
                </div>
                <div id="timer-section">
                    <div id="timer-bar"><div id="timer-bar-fill"></div></div>
                    <span id="timer-display">30</span>
                </div>
            </div>

            <!-- 分数区域 -->
            <div id="score-zone">
                <div id="score-display">
                    <span id="score-count">0</span>
                    <span class="score-separator">/</span>
                    <span id="target-score">100</span>
                </div>
                <div id="multiplier-section">
                    <span class="mult-label">倍率</span>
                    <span id="multiplier-display">1.0</span>
                    <span class="mult-x">×</span>
                </div>
            </div>

            <!-- 打字区域 -->
            <div id="typing-zone">
                <div id="word-zone">
                    <div id="word-display"></div>
                </div>
                <div id="skill-trigger-zone"></div>
            </div>

            <!-- 底部HUD -->
            <div id="bottom-hud">
                <div id="combo-display">
                    <span id="combo-count">0</span>
                    <span class="combo-label">COMBO</span>
                </div>
                <div id="shield-display" class="shield-hidden">
                    <span id="shield-count">0</span>
                    <span class="shield-label">SHIELD</span>
                </div>
                <div id="active-library"></div>
            </div>
        </div>

        <!-- === SHOP SCREEN === -->
        <div id="shop-screen" class="screen">
            <div id="shop-header">
                <div id="shop-title">商店</div>
                <div id="shop-result">
                    Level <span id="shop-level-num">1</span> 完成!
                    <span class="result-detail">
                        得分: <span id="shop-score">0</span> / <span id="shop-target">100</span>
                        (奖励: <span id="shop-bonus">0</span>)
                    </span>
                </div>
            </div>

            <div id="shop-content">
                <!-- Left: Shop Items -->
                <div id="shop-items">
                    <div class="shop-section-header">
                        <div id="shop-tabs"></div>
                        <div class="gold-display">💰 <span id="shop-gold">30</span></div>
                    </div>
                    <div id="reward-cards"></div>
                </div>

                <!-- Right: Build Manager -->
                <div id="shop-build">
                    <div class="shop-section-title">
                        <span id="build-tab" class="build-tab active">构筑</span>
                        <span id="stats-tab" class="build-tab">📊 统计</span>
                        <span id="words-tab" class="build-tab">📚 词库</span>
                    </div>
                    <div id="stats-panel" style="display:none;"></div>
                    <div id="word-panel" style="display:none;">
                        <div class="word-panel-header">
                            <span class="inventory-label">词库 <span id="word-count"></span></span>
                        </div>
                        <div id="owned-words"></div>
                    </div>
                    <div id="build-manager">
                        <div id="bound-grid"></div>
                        <div id="skill-inventory">
                            <div class="inventory-label">已拥有技能</div>
                            <div id="owned-skills"></div>
                        </div>
                    </div>
                </div>
            </div>

            <div id="sell-zone">🗑️ 拖到此处出售</div>
            <div id="shop-footer">
                <div id="shop-relics">
                    <span class="relics-label">遗物:</span>
                    <div id="shop-relic-icons"></div>
                </div>
                <button id="start-battle-btn">开始下一关</button>
            </div>
        </div>

        <!-- === REST SCREEN === -->
        <div id="rest-screen" class="screen">
            <div class="rest-header">
                <div class="rest-title">休息关</div>
                <div class="rest-act-label" id="rest-act-label"></div>
            </div>
            <div class="rest-event" id="rest-event">
                <div class="event-icon" id="rest-event-icon"></div>
                <div class="event-name" id="rest-event-name"></div>
                <div class="event-description" id="rest-event-desc"></div>
            </div>
            <div class="rest-options" id="rest-options"></div>
            <div class="rest-result rest-result-hidden" id="rest-result">
                <div class="result-text" id="rest-result-text"></div>
                <button class="rest-continue-btn" id="rest-continue-btn">继续旅程</button>
            </div>
        </div>

        <!-- === GAME OVER === -->
        <div id="gameover-screen" class="screen">
            <div id="gameover-content">
                <div id="gameover-title">GAME OVER</div>
                <div id="gameover-stats"></div>
                <button class="restart-btn" id="restart-btn">再来一局</button>
            </div>
        </div>

        <!-- Relic Picker Modal -->
        <div id="relic-picker-modal" class="relic-picker-hidden">
            <div class="relic-picker-overlay"></div>
            <div class="relic-picker-content">
                <div class="relic-picker-title">🏺 选择一件遗物 🏺</div>
                <div class="relic-picker-cards" id="relic-picker-cards"></div>
                <button class="relic-picker-skip" id="relic-picker-skip">跳过</button>
            </div>
        </div>

        <!-- Enchantment Modal -->
        <div id="enchantment-modal" class="enchantment-hidden">
            <div class="enchantment-overlay"></div>
            <div class="enchantment-content">
                <div class="enchantment-title" id="enchantment-title">⚡ 技能附魔 ⚡</div>
                <div class="enchantment-branches" id="enchantment-branches"></div>
                <button class="enchantment-cancel" id="enchantment-cancel">取消</button>
            </div>
        </div>

        <!-- Effects -->
        <div id="particles"></div>

        <!-- Score Settlement (Balatro-style) -->
        <div id="score-settlement" class="settlement-hidden">
            <div class="settlement-panel">
                <div class="settlement-chips">
                    <span class="settlement-label">基数</span>
                    <span class="settlement-value" id="settlement-chips">0</span>
                </div>
                <div class="settlement-mult">
                    <span class="settlement-symbol">×</span>
                    <div class="settlement-mult-box">
                        <span class="settlement-label">倍率</span>
                        <span class="settlement-value" id="settlement-mult">1.0</span>
                    </div>
                </div>
                <div class="settlement-score">
                    <span class="settlement-symbol">+</span>
                    <div class="settlement-score-box">
                        <span class="settlement-label">分数</span>
                        <span class="settlement-value" id="settlement-score">0</span>
                    </div>
                </div>
                <div class="settlement-result">
                    <span class="settlement-symbol">=</span>
                    <span class="settlement-final" id="settlement-final">0</span>
                </div>
            </div>
        </div>

        <!-- Gold Reward Animation -->
        <div id="gold-reward" class="gold-reward-hidden">
            <div class="gold-reward-panel">
                <div class="gold-reward-title">LEVEL CLEAR!</div>
                <div class="gold-reward-row">
                    <span class="gold-reward-label">基础奖励</span>
                    <span class="gold-reward-value" id="gold-base">+20</span>
                </div>
                <div class="gold-reward-row gold-overkill-row">
                    <span class="gold-reward-label">Overkill</span>
                    <span class="gold-reward-value gold-overkill" id="gold-overkill">+0</span>
                </div>
                <div class="gold-reward-row gold-time-row">
                    <span class="gold-reward-label">剩余时间</span>
                    <span class="gold-reward-value gold-time" id="gold-time">+0</span>
                </div>
                <div class="gold-reward-row gold-treasure-row" style="display:none">
                    <span class="gold-reward-label">藏宝图</span>
                    <span class="gold-reward-value gold-treasure" id="gold-treasure">+15</span>
                </div>
                <div class="gold-reward-total">
                    <span class="gold-icon">💰</span>
                    <span class="gold-total-value" id="gold-total">+20</span>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
